<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>권도현 명함</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 900px; height: 540px; overflow: hidden; }
  body { background: #d9d4cc; background-image: radial-gradient(ellipse at 30% 20%, #ebe7e0 0%, #d9d4cc 60%, #c9c3ba 100%); font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; display: flex; align-items: center; justify-content: center; }
  .card { width: 800px; height: 450px; background: #fff; border-radius: 6px; box-shadow: 0 18px 40px rgba(0,0,0,0.28), 0 2px 6px rgba(0,0,0,0.12); transform: rotate(-1.6deg); position: relative; overflow: hidden; display: flex; }
  .side { width: 250px; background: #0f2a4a; color: #fff; padding: 44px 34px; display: flex; flex-direction: column; justify-content: space-between; }
  .mark { width: 46px; height: 46px; position: relative; }
  .mark svg { display: block; }
  .brand { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.25; }
  .brand small { display: block; font-size: 11.5px; font-weight: 400; letter-spacing: 1.6px; color: #9fb6d1; margin-top: 6px; font-family: Arial, Helvetica, sans-serif; }
  .main { flex: 1; padding: 54px 52px 44px 52px; display: flex; flex-direction: column; justify-content: space-between; color: #1a1f26; }
  .name { font-size: 38px; font-weight: 700; letter-spacing: 6px; }
  .name-en { font-size: 13px; color: #6b7480; letter-spacing: 1.2px; font-family: Arial, Helvetica, sans-serif; margin-top: 6px; }
  .title { font-size: 16px; color: #0f2a4a; margin-top: 16px; font-weight: 600; }
  .title span { color: #8a94a0; font-weight: 400; margin-left: 8px; font-family: Arial, Helvetica, sans-serif; font-size: 13px; }
  .info { font-size: 13.5px; line-height: 1.85; color: #3a424c; }
  .info b { font-weight: 600; color: #0f2a4a; }
  .rule { height: 2px; width: 36px; background: #0f2a4a; margin: 18px 0 14px; }
</style>
</head>
<body>
<div class="card">
  <div class="side">
    <div>
      <div class="mark"><svg width="46" height="46" viewBox="0 0 46 46"><polygon points="23,2 27,18 44,23 27,28 23,44 19,28 2,23 19,18" fill="#fff"/><circle cx="23" cy="23" r="4" fill="#0f2a4a"/></svg></div>
      <div class="brand" style="margin-top:22px">노스스타<br>벤처스<small>NORTHSTAR VENTURES</small></div>
    </div>
    <div style="font-size:11px;color:#9fb6d1;letter-spacing:1px;font-family:Arial,Helvetica,sans-serif">www.northstar.vc</div>
  </div>
  <div class="main">
    <div>
      <div class="name">권도현</div>
      <div class="name-en">DOHYUN KWON</div>
      <div class="title">심사역 <span>Investment Associate</span></div>
      <div class="rule"></div>
    </div>
    <div class="info">
      <div><b>E</b>&nbsp;&nbsp; dohyun.kwon@northstar.vc</div>
      <div><b>A</b>&nbsp;&nbsp; 서울특별시 강남구 테헤란로 152, 12층</div>
      <div><b>W</b>&nbsp;&nbsp; northstar.vc</div>
    </div>
  </div>
</div>
</body>
</html>
